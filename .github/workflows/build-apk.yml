name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Marquis POS App
        run: |
          node scripts/configure-app.js pos
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Marquis-POS.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Bliss-POS.apk
          cd ..

      - name: Build Marquis Captain App
        run: |
          node scripts/configure-app.js captain
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Marquis-Captain.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Bliss-Captain.apk
          cd ..

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hotel-marquis-apks
          path: |
            Marquis-POS.apk
            Marquis-Captain.apk
            Bliss-POS.apk
            Bliss-Captain.apk

      - name: Create GitHub Release with Both APKs
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Hotel Marquis v1.0.${{ github.run_number }} (POS & Captain)"
          body: |
            ### 🏨 Hotel Marquis — Dedicated Android APKs
            
            1. **📱 Marquis Captain (Waiters & Stewards App)**
               - File: `Marquis-Captain.apk`
               - Opens directly to: `/captain`
               - Features: Table floor layout, live KOT punching, table shifting, cashier alerts, and table-side cash/UPI settlement.
            
            2. **🖥️ Marquis POS (Cashier Counter App)**
               - File: `Marquis-POS.apk`
               - Opens directly to: `/pos`
               - Features: Central POS terminal, live kitchen monitor, cash tender calculator, dynamic counter UPI QR, split payments, 80mm GST printing, Day Register.
          files: |
            Marquis-POS.apk
            Marquis-Captain.apk
            Bliss-POS.apk
            Bliss-Captain.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
